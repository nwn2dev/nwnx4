name: NWNX4
on: [push, pull_request]

env:
  nwnlibd_version: v1.0.2

jobs:

  build:
    name: Build
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      # ---------------- MSVC ----------------

      - name: Prepare MSVC tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # ---------------- Python / Meson ----------------

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Meson + Ninja
        run: pip install meson ninja

      # ---------------- VCPKG ----------------

      - name: Restore cached VCPKG
        id: vcpkg_cache
        uses: actions/cache@v3
        with:
          path: vcpkg_installed/
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Install VCPKG dependencies
        if: steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: lukka/run-vcpkg@v10
        env:
          VCPKG_DEFAULT_TRIPLET: x86-windows-static-md
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKG_DISABLE_METRICS: 1
        with:
          runVcpkgInstall: true
          doNotCache: true

      # ---------------- Meson Build (MSVC SAFE) ----------------

      - name: Meson Configure
        run: meson setup builddir --buildtype=release --optimization=2 --vsenv

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        continue-on-error: true
        with:
          languages: cpp
          source-root: src

      - name: Meson Build
        run: meson compile -C builddir

      - name: Meson Install
        run: meson install -C builddir --destdir=nwnx4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        continue-on-error: true

      # ---------------- nwn-lib-d-tools ----------------

      - name: Restore cached nwn-lib-d-tools
        id: nwnlibd_cache
        uses: actions/cache@v3
        with:
          path: C:/nwn-lib-d-tools/
          key: nwn-lib-d-tools-${{env.nwnlibd_version}}

      - name: Install nwn-lib-d-tools
        if: steps.nwnlibd_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L "https://github.com/CromFr/nwn-lib-d/releases/download/${{env.nwnlibd_version}}/nwn-lib-d-tools-windows-x86_64.zip" -o tools.zip
          unzip tools.zip -d /c/
          rm tools.zip

      # ---------------- Package ----------------

      - name: Package NWNX4
        shell: bash
        run: |
          rm -f nwnx4/*.lib
          rm -f nwnx4/plugins/*.lib
          /c/nwn-lib-d-tools/nwn-erf create -o nwnx4/nwscript/nwnx.erf nwnx4/nwscript/

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          path: nwnx4/
          name: nwnx4-${{ github.sha }}

  # --------------------------------------------------

  clang-format:
    name: clang-format check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format
        run: |
          sudo apt update
          sudo apt install -y clang-format-14

      - name: Check formatting
        run: |
          git ls-files \*.h \*.cpp \*.c \
            | grep -vE '^src/plugins/xp_sqlite/lib/|^src/plugins/xp_bugfix/|^src/NWN2Lib/' \
            | xargs -d '\n' clang-format-14 --dry-run --Werror

  # --------------------------------------------------

  test:
    name: Run test module
    needs: build
    runs-on: windows-latest

    strategy:
      matrix:
        sql: ["xp_mysql", "xp_sqlite"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v3
        with:
          name: nwnx4-${{ github.sha }}
          path: C:/nwnx4/

      - name: Install cached nwn-lib-d-tools
        uses: actions/cache@v3
        with:
          path: C:/nwn-lib-d-tools/
          key: nwn-lib-d-tools-${{env.nwnlibd_version}}

      - name: Download NWN2Server
        shell: bash
        run: |
          curl -L https://raw.githubusercontent.com/wiki/nwn2dev/nwnx4/nwnx4_nwn2server.zip -o server.zip
          7z x server.zip -o/c/
          rm server.zip

      - name: Install dependencies
        run: choco install directx vcredist2010 procdump -y

      - name: Enable crash dumps
        run: |
          mkdir C:\CrashDumps
          procdump.exe -i C:\CrashDumps -ma -k

      - name: Copy test module
        shell: bash
        run: cp -r test/ /c/nwn2home

      - name: Configure NWNX4
        shell: bash
        run: |
          mkdir -p /c/nwnx4_user/plugins
          cp /c/nwnx4/config.example/* /c/nwnx4_user/
          echo "Configuration ready"

      - name: Start server and verify
        shell: bash
        run: |
          set -o pipefail
          cd /c/nwnx4_user/
          powershell -Command "Start-Process ../nwnx4/NWNX4_Controller.exe -ArgumentList '-verbose','-interactive'"
          sleep 20
          tasklist | grep -qi "nwn2server.exe"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          path: |
            C:/CrashDumps/*
            C:/nwnx4_user/*.txt
          name: test-${{matrix.sql}}-logs

  # --------------------------------------------------

  release:
    name: Create release if tagged
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v3
        with:
          name: nwnx4-${{ github.sha }}
          path: nwnx4/

      - name: Compress release
        run: zip -r nwnx4.zip nwnx4/

      - name: Create draft release
        uses: softprops/action-gh-release@v1
        with:
          files: nwnx4.zip
          draft: true
